<app-header />
<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user [user]="user" [isSelected]=" user.id === selectedUserId" (selectedUser)="onSelectUser($event)"/>
      </li>
    }
  </ul>
  @if (selectedUser) {
    <!-- emitted data will be used in here -->
    <app-tasks [userId]="selectedUser.id" [name]="selectedUser.name"/>
  } @else {
      <p id="fallback">Select a user to see their task</p>  
  
  }
</main>
